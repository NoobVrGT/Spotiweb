<!DOCTYPE html>
<html>
<head>
  <title>Spotiweb — Visualizer</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/84/Spotify_icon.svg">
</head>
<body data-page="visualizer">

<div id="spotiButton">
  <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Spotify_icon.svg">
</div>

<aside id="sidebar">
  <div class="sidebar-header">
    <h1>Spotiweb</h1>
    <img class="spotify-icon-small" src="https://upload.wikimedia.org/wikipedia/commons/8/84/Spotify_icon.svg">
  </div>

  <nav class="sidebar-nav">
    <a href="index.html" class="nav-link"><button class="nav-btn">Now Playing</button></a>
    <a href="stats.html" class="nav-link"><button class="nav-btn">Stats</button></a>
    <a href="recent.html" class="nav-link"><button class="nav-btn">Recent</button></a>
    <a href="visualizer.html" class="nav-link"><button class="nav-btn">Visualizer</button></a>
  </nav>
</aside>

<main>
  <div class="panel">
    <canvas id="visualizerCanvas"></canvas>

    <div class="audio-controls">
      <input type="file" id="audioFileInput" accept="audio/*" hidden>
<button id="chooseFileBtn" class="nav-btn">Choose Audio File</button>

      <button id="playBtn" disabled>Play</button>
      <button id="pauseBtn" disabled>Pause</button>
    </div>
  </div>
</main>

<audio id="audioElement" crossorigin="anonymous"></audio>
<script src="assets/main.js"></script>
</body>
</html>
